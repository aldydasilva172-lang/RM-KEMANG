<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internal Barcode - Toshiba B-FV4</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#f4f5f7;font-family:Arial,sans-serif;color:#202124}.panel{max-width:700px;margin:0 auto 20px;background:#fff;padding:20px;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.08)}h1{margin:0 0 6px;font-size:22px}.note{font-size:13px;color:#6b7280;margin-bottom:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input{width:100%;height:40px;border:1px solid #d5d9df;border-radius:8px;padding:0 10px;font-size:14px}.actions{display:flex;gap:10px;margin-top:15px}button{border:0;border-radius:8px;padding:11px 18px;cursor:pointer;font-weight:700}.previewBtn{background:#eef1f5;color:#333}.printBtn{background:#e56f08;color:#fff}.print-area{width:62mm;height:15mm;background:#fff;margin:20px auto;padding:1.5mm 2mm 1mm;overflow:hidden}.label{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}.product{width:100%;font-size:7pt;line-height:7pt;font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;margin-bottom:.6mm}.barcode{width:53mm;height:7mm;display:block}.code{font-family:Arial,sans-serif;font-size:7.5pt;line-height:7pt;letter-spacing:.7mm;margin-top:.5mm;white-space:nowrap}@page{size:62mm 15mm;margin:0}@media print{html,body{width:62mm;height:15mm;margin:0;padding:0;background:#fff}body *{visibility:hidden}.print-area,.print-area *{visibility:visible}.print-area{position:absolute;left:0;top:0;width:62mm;height:15mm;margin:0;padding:1.5mm 2mm 1mm}.no-print{display:none!important}}@media(max-width:600px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="panel no-print">
<h1>INTERNAL BARCODE</h1>
<div class="note">Test print khusus label Toshiba B-FV4 • 203 dpi • 62 × 15 mm</div>
<div class="row">
<div><label>Nama Produk</label><input id="product" value="SIGNATURE BEEF BURGER"></div>
<div><label>Kode Barcode</label><input id="code" value="100000117185"></div>
</div>
<div class="actions"><button class="previewBtn" onclick="updateLabel()">UPDATE</button><button class="printBtn" onclick="window.print()">PRINT TEST</button></div>
</div>
<div class="print-area"><div class="label"><div id="productPreview" class="product">SIGNATURE BEEF BURGER</div><svg id="barcodePreview" class="barcode" viewBox="0 0 240 40" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"></svg><div id="codePreview" class="code">100000117185</div></div></div>
<script>
function makeBarcode(){const svg=document.getElementById('barcodePreview');const pattern=[2,1,1,2,1,2,2,1,1,1,2,1,1,2,2,1,2,1,1,2,1,1,2,2,1,1,2,1,2,2,1,1,1,2,1,2,2,1,1,2,1,1,2,2,1,2,1,1,2,1,2,1,1,2,2,1,1,2,1,2,1,1,2,1,2,2];let x=2,bars='';pattern.forEach((w,i)=>{if(i%2===0)bars+=`<rect x="${x}" y="0" width="${w}" height="40" fill="#000"></rect>`;x+=w});svg.innerHTML=`<rect width="240" height="40" fill="#fff"></rect>${bars}`}
function updateLabel(){const product=document.getElementById('product').value.trim()||'PRODUCT';const code=document.getElementById('code').value.trim()||'100000117185';document.getElementById('productPreview').textContent=product;document.getElementById('codePreview').textContent=code;makeBarcode()}updateLabel();
</script>
</body>
</html>
